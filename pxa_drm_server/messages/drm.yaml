# ---- 도메인 메시지 ----
drm:
  encrypt_ok: "'{filename}' 파일을 암호화했습니다."
  decrypt_ok: "'{filename}' 파일을 복호화했습니다."
  check_encrypted: "'{filename}' 파일은 암호화되어 있습니다."
  check_plain: "'{filename}' 파일은 암호화되어 있지 않습니다."
  target_required: "filepath, uri, file 중 하나는 반드시 지정해야 합니다."
  target_conflict: "filepath, uri, file 중 하나만 지정할 수 있습니다."
